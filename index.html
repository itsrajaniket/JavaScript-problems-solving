<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 40px;
        line-height: 1.6;
      }
      h1 {
        color: #2c3e50;
        text-align: center;
      }
      p {
        max-width: 600px;
        margin: 20px auto;
        font-size: 18px;
      }
      .box {
        border: 2px solid #2c3e50;
        padding: 20px;
        border-radius: 8px;
        background: #fff;
        max-width: 600px;
        margin: 20px auto;
      }
    </style>
  </head>
  <body>
    <h1>My Simple HTML Page</h1>
    <p>
      This is a basic page with text and styling only. No features, no scripts —
      just clean HTML and CSS.
    </p>

    <div class="box">
      <p>You can use this box to highlight important text or notes.</p>
    </div>
  </body>
</html>
